<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Product Details</title>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@2.51.6/dist/full.css" rel="stylesheet">
</head>

<body class="p-6 flex justify-center">

    <div id="product-container"></div>

    <script>
        // 1. Get product ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const productId = urlParams.get("id");

        // 2. Fetch product details
        fetch(`https://fakestoreapi.com/products/${productId}`)
            .then(res => res.json())
            .then(product => displayProduct(product));

        const displayProduct = (product) => {
            const container = document.getElementById("product-container");

            container.innerHTML = `
                <div class="card bg-base-100 w-96 shadow-lg">
                    <figure class="p-4">
                        <img src="${product.image}" alt="${product.title}" class="h-64 w-full object-contain rounded-md" />
                    </figure>
                    <div class="card-body">
                        <!-- Title with NEW badge -->
                        <h2 class="card-title">
                            ${product.title.slice(0, 30)}...
                            <div class="badge badge-secondary">NEW</div>
                        </h2>

                        <!-- Full Description -->
                        <p class="text-gray-700">${product.description}</p>

                        <!-- Price -->
                        <p class="font-semibold text-lg mt-2">$${product.price}</p>

                        <!-- Category and Rating -->
                        <div class="card-actions justify-between mt-4">
                            <div class="badge badge-outline">${product.category}</div>
                            <div class="flex items-center gap-1">
                                <i class="fa-solid fa-star text-yellow-400"></i>
                                <span>${product.rating.rate}</span>
                                <span class="text-gray-500 ml-1">(${product.rating.count})</span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="card-actions justify-end mt-4 gap-2">
                            <button class="btn btn-primary flex items-center gap-2">
                                <i class="fa-solid fa-cart-arrow-down"></i> Add to Cart
                            </button>
                            <button onclick="window.history.back()" class="btn btn-outline">Back</button>
                        </div>
                    </div>
                </div>
            `;
        }
    </script>

</body>

</html>
